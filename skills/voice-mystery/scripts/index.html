      let s;

          break;
        }
        case "notebook": narration = "Your discovered evidence is listed in notebook. Undiscovered facts are not included."; break;
        case "hint": narration = c.hints[Math.min(s.hints, 2)]; s.hints = Math.min(3, s.hints + 1); break;
        case "accuse": {
